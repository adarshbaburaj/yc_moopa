<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moopa STOP</title>
<style>
  :root { --bg: #f7efe3; --ink: #1d1b18; --muted: #6d665c; --red: #c62828; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #1d1b18; --ink: #f7efe3; --muted: #b8afa3; } }
  :root[data-theme="dark"] { --bg: #1d1b18; --ink: #f7efe3; --muted: #b8afa3; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px;
         padding: 16px; background: var(--bg); color: var(--ink); font: 18px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-align: center; }
  button { width: min(80vw, 380px); aspect-ratio: 1; border-radius: 50%; border: 10px solid #fff; background: var(--red); color: #fff;
           font: 900 clamp(44px, 14vw, 72px)/1 -apple-system, sans-serif; letter-spacing: .04em; box-shadow: 0 10px 40px rgba(198,40,40,.45); cursor: pointer; }
  button:active { transform: scale(.97); }
  button.done { background: #1d1b18; }
  p { margin: 0; color: var(--muted); max-width: 30ch; }
</style>
</head>
<body>
  <button id="b" onclick="go()">STOP</button>
  <p id="t">Stops everything Moopa is doing on this phone: the task, its voice, the mic and any call it placed.</p>
<script>
async function go() {
  const b = document.getElementById("b"), t = document.getElementById("t");
  b.textContent = "…";
  try {
    const r = await fetch("/action/estop", { method: "POST" });
    if (!r.ok) throw new Error(r.status);
    b.textContent = "STOPPED"; b.classList.add("done"); t.textContent = "Moopa has stopped. Double-tap the band to start again.";
  } catch (e) {
    b.textContent = "STOP"; t.textContent = "Could not reach Moopa on the laptop. Use the STOP button on the laptop, or press x there.";
  }
  setTimeout(() => { b.textContent = "STOP"; b.classList.remove("done"); }, 3000);
}
</script>
</body>
</html>
