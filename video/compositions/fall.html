  <script>
    const tl = gsap.timeline({ paused: true });
    const inWords = (sel, t, gap = 0.067) => document.querySelectorAll(sel).forEach((w, i) =>

    inWords("#fall-time .w", 0.06, 0.1); outBlur("#fall-time .w", 0.72);
    inWords("#fall-title .w", 0.83, 0.08);
    // thresholds, then the trace draws: walking, free-fall, impact, still
    tl.fromTo("#fall-ff, #fall-im, #fall-ff-t, #fall-im-t", { opacity: 0 }, { opacity: 1, duration: 0.17 }, 0.11);
    tl.fromTo("#fall-path", { strokeDasharray: 2600, strokeDashoffset: 2600 }, { strokeDashoffset: 1700, duration: 0.77, ease: "none" }, 0.11);
