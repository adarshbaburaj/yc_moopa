<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #f4f1ec; font-family: "Inter", sans-serif; color: #1d1b18; }
    #band-win { position: absolute; inset: 0; }
    #band-cam { position: absolute; inset: 0; transform-origin: 677px 532px; }
    #band-cam img { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; }
    #band-title { position: absolute; left: 1150px; top: 250px; width: 620px; font-weight: 900; font-size: 124px; line-height: 1; letter-spacing: -0.035em; }
    #band-title .acc { color: #7c4dff; }
    #band-how { position: absolute; left: 1150px; top: 540px; width: 640px; font-weight: 700; font-size: 46px; line-height: 1.2; letter-spacing: -0.01em; }
    #band-what { position: absolute; left: 1150px; top: 680px; width: 640px; font-weight: 400; font-size: 34px; line-height: 1.3; color: #6d665c; }
    #band-wave { position: absolute; left: 1150px; top: 800px; width: 620px; height: 120px; display: flex; align-items: center; gap: 10px; }
    #band-wave i { display: block; width: 12px; height: 120px; border-radius: 6px; background: #1d1b18; }
    #band-next { position: absolute; left: 160px; right: 160px; top: 470px; text-align: center; font-weight: 900; font-size: 96px; letter-spacing: -0.03em; line-height: 1.05; }
    #root .w { display: inline-block; white-space: pre; }
  </style>
  <div id="root" data-composition-id="band" data-width="1920" data-height="1080">
    <div id="band-shot" class="clip" data-start="0" data-duration="6.2" data-track-index="1" data-layout-allow-overflow>
      <div id="band-win"><div id="band-cam"><img id="band-img" src="assets/stills/band-wrist.jpg" alt="The Vexo band on a wrist" /></div></div>
    </div>
    <div id="band-title" class="clip" data-start="1.6" data-duration="4.4" data-track-index="2"><span class="w">The </span><span class="w">band</span><br /><span class="w acc">listens.</span></div>
    <div id="band-how" class="clip" data-start="2.5" data-duration="3.5" data-track-index="3"><span class="w">Double-tap. </span><span class="w">Speak.</span><br /><span class="w">Double-tap </span><span class="w">to </span><span class="w">stop.</span></div>
    <div id="band-what" class="clip" data-start="3.2" data-duration="2.8" data-track-index="4">Vexo Open band: a microphone and a motion sensor.</div>
    <div id="band-wave" class="clip" data-start="3.6" data-duration="2.4" data-track-index="5" data-layout-allow-overflow></div>
    <div id="band-next" class="clip" data-start="5.85" data-duration="1.15" data-track-index="6"><span class="w">“Order </span><span class="w">yoga </span><span class="w">mats </span><span class="w">for </span><span class="w">me, </span><span class="w">please.”</span></div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    // 32 bars, heights from a fixed speech-like envelope (deterministic)
    const wave = document.getElementById("band-wave");
    const env = [0.2,0.35,0.6,0.9,0.7,0.45,0.8,1,0.75,0.5,0.3,0.55,0.85,0.95,0.6,0.4,0.25,0.5,0.75,0.9,0.65,0.4,0.6,0.8,0.55,0.35,0.5,0.7,0.45,0.3,0.2,0.15];
    env.forEach(() => wave.appendChild(document.createElement("i")));
    const bars = wave.querySelectorAll("i");

    // whip in from the hook, then push in on the band
    tl.fromTo("#band-cam", { x: 260, filter: "blur(18px)" }, { x: 0, filter: "blur(0px)", duration: 0.32, ease: "power3.out" }, 0);
    tl.fromTo("#band-cam", { scale: 1 }, { scale: 1.9, duration: 0.9, ease: "power2.inOut" }, 0.4);
    // the footage falls away around the band: only a window on the band stays
    tl.fromTo("#band-win", { clipPath: "inset(0px 0px 0px 0px round 0px)" },
      { clipPath: "inset(140px 870px 150px 290px round 56px)", duration: 0.65, ease: "power2.inOut" }, 1.2);
    // titles
    document.querySelectorAll("#band-title .w").forEach((w, i) =>
      tl.fromTo(w, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, ease: "power2.out" }, 1.65 + i * 0.09));
    document.querySelectorAll("#band-how .w").forEach((w, i) =>
      tl.fromTo(w, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, ease: "power2.out" }, 2.55 + i * 0.08));
    tl.fromTo("#band-what", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power2.out" }, 3.25);
    // the voice: bars rise in a ripple, then speak
    bars.forEach((b, i) => {
      tl.fromTo(b, { scaleY: 0.06 }, { scaleY: env[i], duration: 0.35, ease: "expo.out" }, 3.65 + i * 0.02);
      tl.to(b, { scaleY: Math.max(0.08, 1 - env[i] * 0.7), duration: 0.5, ease: "sine.inOut" }, 4.4 + (i % 5) * 0.03);
      tl.to(b, { scaleY: env[(i + 7) % env.length], duration: 0.45, ease: "sine.inOut" }, 4.95 + (i % 5) * 0.03);
    });
    // everything leaves; the next sentence is what the band hears next
    tl.to("#band-win", { scale: 0.92, opacity: 0, filter: "blur(10px)", duration: 0.3, ease: "power3.in" }, 5.55);
    tl.to("#band-title .w, #band-how .w, #band-what", { opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power3.in" }, 5.5);
    tl.to(bars, { scaleY: 0.04, duration: 0.25, ease: "power3.in" }, 5.55);
    document.querySelectorAll("#band-next .w").forEach((w, i) =>
      tl.fromTo(w, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, ease: "power2.out" }, 5.9 + i * 0.067));
    window.__timelines["band"] = tl;
  </script>
</template>
