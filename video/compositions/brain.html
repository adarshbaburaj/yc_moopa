  <script>
    const tl = gsap.timeline({ paused: true });
    document.querySelectorAll("#brain-q .w").forEach((w, i) =>
      tl.fromTo(w, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, ease: "power2.out" }, 0.15 + i * 0.09));
    tl.to("#brain-q .w", { opacity: 0, filter: "blur(8px)", duration: 0.18, ease: "power3.in" }, 1.5);

    // waveform for the first stop
    const env = [0.25,0.5,0.85,0.6,0.95,0.7,0.4,0.8,1,0.65,0.35,0.6,0.9,0.5,0.3,0.55,0.75,0.45,0.25,0.15];
    const wv = document.getElementById("st0-wave");
    env.forEach(() => wv.appendChild(document.createElement("i")));
    const bars = wv.querySelectorAll("i");

    // camera: the route slides; each stop holds ~2.75 s
    const STOP = 1600, T0 = 1.5, HOLD = 2.15, MOVE = 0.55;
    tl.fromTo("#brain-route", { x: 1920 }, { x: 0, duration: MOVE, ease: "power2.inOut" }, T0);
    for (let i = 1; i < 7; i++) {
      tl.to("#brain-route", { x: -STOP * i, duration: MOVE, ease: "power2.inOut" }, T0 + i * HOLD);
    }
    // the request travels with the camera: the dot moves stop to stop
    for (let i = 1; i < 7; i++) {
      tl.to("#brain-dot", { x: STOP * i, duration: MOVE, ease: "power2.inOut" }, T0 + i * HOLD);
    }
    // each stop builds as the camera arrives: verb, artifact (morph in), tech, why
    for (let i = 0; i < 7; i++) {
      const t = T0 + i * HOLD + (i === 0 ? MOVE : MOVE * 0.75);
      tl.fromTo("#st" + i + " .verb", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power2.out" }, t);
      tl.fromTo("#st" + i + " .art > *", { scaleX: 0.6, opacity: 0, filter: "blur(12px)" }, { scaleX: 1, opacity: 1, filter: "blur(0px)", duration: 0.3, ease: "power3.out" }, t + 0.12);
      tl.fromTo("#st" + i + " .tech", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power2.out" }, t + 0.3);
      tl.fromTo("#st" + i + " .why", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, t + 0.35);
    }
    bars.forEach((b, i) => {
      tl.fromTo(b, { scaleY: 0.05 }, { scaleY: env[i], duration: 0.35, ease: "expo.out" }, T0 + MOVE + 0.15 + i * 0.02);
      tl.to(b, { scaleY: env[(i + 6) % env.length], duration: 0.5, ease: "sine.inOut" }, T0 + MOVE + 0.9 + (i % 4) * 0.03);
      tl.to(b, { scaleY: env[(i + 11) % env.length], duration: 0.5, ease: "sine.inOut" }, T0 + MOVE + 1.45 + (i % 4) * 0.03);
    });
    window.__timelines["brain"] = tl;
  </script>
